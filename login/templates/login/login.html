
{% extends 'login/layout.html' %}
{% load static %}


{% block css %}
<title>Login</title>

<link rel="stylesheet" href="{% static 'css/login.css' %}">
<link rel="stylesheet" href="{% static 'css/blob.css' %}">

{% endblock %}

{% block body %}

<div class="blob one blob-yellow"></div>
<div class="blob two blob-yellow"></div>
<div class="blob three blob-yellow"></div>


<div class="login">    
    <img src="{% static  %}" alt="">
    <h1 class="login-text">Log in</h1>
    
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <label class="name">Name: <br>
            <input type="text" placeholder="username" name="username" required>
        </label>
        <br>
        <label class="password">Password: <br> 
            <input type="password" placeholder="Password" name="password" required>
        </label>
        <br>

        

        <input class="submit-button" 
                type="submit" 
                value="Log in">
        <div style="color: red;">{{ credential_error }}</div>
    </form>


</div>


{% endblock %}
