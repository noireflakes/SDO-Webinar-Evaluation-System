{% extends "login/layout.html" %}

{% load static %}

{% block css %}
 <link rel="stylesheet" href="{% static 'css/otp.css' %}">
 <link rel="stylesheet" href="{% static 'css/blob.css' %}">
 
 {% endblock %}

{% block body %}


{% if otp %}
    <div>{{ otp }}</div>

{% endif %}



<div class="blob one blob-yellow"><p></p></div>
<div class="blob two blob-yellow"><p></p></div>
<div class="blob three blob-yellow"><p></p></div>

<div>{{ otp_code }}</div>
<form action="{% url 'otp' %}" method="post" id="form">
    {% csrf_token %}
    <h2>Enter OTP</h2>
    <input id="otp" name="otp" type="text" required placeholder="Enter OTP" maxlength="6">
    <input type="submit" value="Submit">
    <div id="timer" class="timer"></div>
</form>

<div><a id="otp_send_button" class="otp-send-link" style="display: none;" href="{% url 'otp' %}">Send OTP again?</a></div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const timerElement = document.getElementById("timer");
        const otpSendButton = document.getElementById("otp_send_button");
       

        let timeLeft = 300;

        const counter = setInterval(function() {
            if (timeLeft > 0) {
                timerElement.textContent = `Time left: ${timeLeft}s`;
                timeLeft--;
            } else {
                clearInterval(counter);
                otpSendButton.style.display = "block"; 
            }
        }, 1000);
    });
</script>

{% endblock %}
