{% extends 'login/layout.html' %}
{% load static %}

{% block css %}
<title>Forgot Password</title>
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<link rel="stylesheet" href="{% static 'css/blob.css' %}">
{% endblock %}

{% block body %}

<div class="blob one blob-yellow"></div>
<div class="blob two blob-yellow"></div>
<div class="blob three blob-yellow"></div>
<img class="bg-login" src="{% static 'asset/logbg.png' %}" alt="login-bg">

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<div class="login">    
    <img class="logo" src="{% static 'asset/logo1.png' %}" alt="logo" style="width: 4rem; height: auto; margin-bottom: 5px;">

    <div class="login-text">Forgot Password</div>
    
    <form method="post">
        {% csrf_token %}

        <label class="email">Email Address: <br>
            <input type="email" placeholder="Enter your email" name="email" required>
        </label>
        <br>

        <input class="submit-button" 
                type="submit" 
                value="Send Reset Link">
    </form>

    <div style="margin-top: 15px;">
        <a class="forgot-pass" href="{% url 'login' %}" style="color:rgb(38, 38, 129); font-weight: 500; text-decoration: none;">Back to Login</a>
    </div>
</div>

<script>
    setTimeout(function () {
        document.querySelectorAll('.alert').forEach(function(el) {
            el.style.display = 'none';
        });
    }, 15000); 
</script>

{% endblock %}
