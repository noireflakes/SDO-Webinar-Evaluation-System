{% extends 'login/layout.html' %}
{% load static %}

{% block css %}
<title>Reset Password</title>
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<link rel="stylesheet" href="{% static 'css/blob.css' %}">
<!-- Bootstrap CSS for icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<style>
    .password-input-group {
        position: relative;
        display: flex;
        align-items: center;
    }
    
    .password-input-group input {
        padding-right: 40px;
        width: 100%;
    }
    
    .password-toggle {
        position: absolute;
        right: 10px;
        background: none;
        border: none;
        color: #6c757d;
        cursor: pointer;
        padding: 0;
        z-index: 10;
        font-size: 1.2rem;
    }
    
    .password-toggle:hover {
        color: #495057;
    }
    
    .password-toggle:focus {
        outline: none;
        color: #495057;
    }
    body{
         background-color: #865dee;
    }
</style>
{% endblock %}

{% block body %}

<div class="blob one blob-yellow"></div>
<div class="blob two blob-yellow"></div>
<div class="blob three blob-yellow"></div>
<img class="bg-login" src="{% static 'asset/logbg.png' %}" alt="login-bg">

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<div class="login">
    <img class="logo" src="{% static 'asset/logo1.png' %}" alt="logo" style="width: 4rem; height: auto; margin-bottom: 5px;">
    
    <div class="login-text">Reset Password</div>
    
    <form method="post">
        {% csrf_token %}
        
        <label class="password">New Password: <br>
            <div class="password-input-group">
                <input type="password" 
                       placeholder="Enter new password" 
                       name="password" 
                       id="password" 
                       required 
                       minlength="6">
                <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </label>
        <br>
        
        <label class="password">Confirm Password: <br>
            <div class="password-input-group">
                <input type="password" 
                       placeholder="Confirm new password" 
                       name="confirm_password" 
                       id="confirm_password" 
                       required 
                       minlength="6">
                <button type="button" class="password-toggle" onclick="togglePassword('confirm_password', this)">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </label>
        <br>
        
        <input class="submit-button"
               type="submit"
               value="Reset Password">
    </form>
    
    <div style="margin-top: 15px;">
        <a class="forgot-pass" href="{% url 'login' %}" style="color:rgb(38, 38, 129); font-weight: 500; text-decoration: none;">Back to Login</a>
    </div>
</div>

<script>
    // Auto-hide alert messages after 15 seconds
    setTimeout(function () {
        document.querySelectorAll('.alert').forEach(function(el) {
            el.style.display = 'none';
        });
    }, 15000);
    
    // Toggle password visibility
    function togglePassword(inputId, button) {
        const passwordInput = document.getElementById(inputId);
        const icon = button.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
</script>

{% endblock %}
